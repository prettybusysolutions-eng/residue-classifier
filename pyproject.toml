[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "residue-classifier"
version = "0.1.0"
description = "Non-destructive filename heuristic classification with explicit limits"
requires-python = ">=3.10"
license = "MIT"
[project.scripts]
residue-classifier = "residue_classifier:main"
[tool.setuptools]
py-modules = ["residue_classifier"]
